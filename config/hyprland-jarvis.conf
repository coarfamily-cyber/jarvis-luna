# ==============================================================================
# JARVIS LUNA - Hyprland Tiling Window Manager Configuration
# Based on hyprwm/Hyprland (GitHub Trending #4, 10k+ stars)
# Optimized for Multi-Agent Monitoring & Jarvis Command Center
# ==============================================================================

# Monitor configuration (Dual monitor setup)
monitor=,preferred,auto,auto

# Startup applications for Jarvis Luna
exec-once = waybar
exec-once = hyprpaper
exec-once = [workspace 1 silent] kitty -e python automation/trending_ai_orchestrator.py status
exec-once = [workspace 2 silent] google-chrome https://coar0000-wq.github.io/jarvis-luna/

# Window Rules for Jarvis Control Center
windowrulev2 = float, class:^(jarvis-control-center)$
windowrulev2 = size 1200 800, class:^(jarvis-control-center)$
windowrulev2 = center, class:^(jarvis-control-center)$
windowrulev2 = opacity 0.95 0.90, class:^(jarvis-control-center)$

# Fluid Animations (Jelly physics & smooth transitions)
animations {
    enabled = yes
    bezier = overshot, 0.05, 0.9, 0.1, 1.05
    bezier = smoothOut, 0.36, 0, 0.66, -0.56
    animation = windows, 1, 5, overshot, slide
    animation = windowsOut, 1, 4, smoothOut, slide
    animation = border, 1, 10, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

# Tiling Layout
dwindle {
    pseudotile = yes
    preserve_split = yes
}
