name: Owned technical review report
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed main commit
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: owned-technical-review-report
  cancel-in-progress: false
jobs:
  report:
    if: github.repository == 'coarfamily-cyber/jarvis-luna' && github.repository_id == '1431541717' && github.ref == 'refs/heads/main' && inputs.expected_sha == github.sha && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Offline report and non-delivery regression
        env:
          PYTHONPATH: scripts
        run: python -B -m unittest test_technical_fix_review test_run_technical_fix_review test_run_technical_review_report -v
      - name: Create sanitized manual review report from saved inputs
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: timeout --signal=TERM --kill-after=5s 45s python -B scripts/run_technical_review_report.py
      - name: Retain only sanitized review artifact not team acknowledgment
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: technical-review-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/technical-review-report-${{ github.run_id }}-${{ github.run_attempt }}/result.json
          if-no-files-found: error
          retention-days: 30
          overwrite: false
