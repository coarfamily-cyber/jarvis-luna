name: Owned GitHub feedback loop report

on:
  workflow_dispatch:
  schedule:
    - cron: '0 23 * * 0' # Monday 08:00 KST

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: owned-github-feedback-loop
  cancel-in-progress: false

jobs:
  feedback-report:
    if: github.repository == 'coarfamily-cyber/jarvis-luna' && github.repository_id == '1431541717' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Test feedback aggregation offline
        env:
          PYTHONPATH: scripts
        run: python -B -m unittest test_github_feedback_loop -v
      - name: Collect aggregate GitHub feedback signals
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B scripts/github_feedback_loop.py
      - name: Retain sanitized report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: jarvis-github-feedback-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/jarvis-feedback-${{ github.run_id }}/feedback_summary.*
          if-no-files-found: error
          retention-days: 30
          overwrite: false
