name: Owned FX read-only observation
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed main commit
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: owned-fx-readonly-observation
  cancel-in-progress: false
jobs:
  observe:
    if: github.repository == 'coarfamily-cyber/jarvis-luna' && github.repository_id == '1431541717' && github.ref == 'refs/heads/main' && inputs.expected_sha == github.sha && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Offline FX and execution boundary regression
        env:
          PYTHONPATH: scripts
        run: python -B -m unittest test_fx_readonly_observation test_fx_provenance test_run_fx_readonly_observation -v
      - name: Observe one fixed public FX endpoint without pricing writes
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: timeout --signal=TERM --kill-after=5s 45s python -B scripts/run_fx_readonly_observation.py
      - name: Preserve only public FX observation receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: fx-readonly-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fx-readonly-observation-${{ github.run_id }}-${{ github.run_attempt }}/result.json
          if-no-files-found: error
          retention-days: 30
          overwrite: false
