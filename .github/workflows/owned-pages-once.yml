name: Owned repository public Pages once
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed main commit (40 characters)
        required: true
        type: string
permissions: {}
concurrency:
  group: owned-pages-once
  cancel-in-progress: false
jobs:
  public-build:
    if: github.repository == 'coarfamily-cyber/jarvis-luna' && github.ref == 'refs/heads/main' && inputs.expected_sha == github.sha
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Install hash-pinned test dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements/requirements-verification.txt
      - name: Offline public projection boundary tests
        env:
          TYPESAFE_ENABLED: '0'
          GEMINI_ENABLED: '0'
          GEMINI_FALLBACK_ENABLED: '0'
        run: |
          python -B - <<'PY'
          import sys, socket, unittest
          def deny(*args, **kwargs):
              raise RuntimeError('Network prohibited during public projection tests')
          socket.create_connection = deny
          socket.socket.connect = deny
          socket.socket.connect_ex = deny
          sys.path.insert(0, 'scripts')
          # Explicit public-boundary suites exclude the legacy commerce load_tests hook.
          for name in ('test_public_site.PublicSiteTests', 'test_operations_public_projection', 'test_improvement_public_projection'):
              result = unittest.TextTestRunner(verbosity=1).run(unittest.defaultTestLoader.loadTestsFromName(name))
              if not result.wasSuccessful(): raise SystemExit(1)
          PY
      - name: Build only reviewed 36 public files and verify unchanged blocked status
        run: |
          node scripts/test_owner_audit.cjs
          python -B scripts/build_public_site.py --output dist --commit "$GITHUB_SHA"
          python -B scripts/check_public_site.py --root dist
          python -B - <<'PY'
          import hashlib, json
          from pathlib import Path
          active = sorted(p.name for p in Path('.github/workflows').rglob('*') if p.is_file() and p.suffix in {'.yml', '.yaml'})
          assert active == ['owned-core-ledger-publisher.yml', 'owned-core-local.yml', 'owned-pages-once.yml', 'owned-repo-smoke.yml', 'owned-shopify-readonly-preflight.yml'], active
          import sys
          sys.path.insert(0, 'scripts')
          from check_owned_workflow_policy import verify
          policy = verify(Path('.'))
          assert policy['active_schedules'] == 1
          assert policy['production_recovered'] is False
          assert len(list(Path('.github/workflows-quarantined/20261023').glob('*.yml'))) == 30
          # Preserve the legacy commerce safety assertions against the INACTIVE copy.
          legacy = Path('.github/workflows-quarantined/20261023/daiso-daily-beauty-shopify.yml').read_text()
          write_command = 'run: python scripts/daiso_daily_beauty_to_shopify.py'
          assert legacy.index("('tests', 'test_daiso_daily_beauty_to_shopify.py')") < legacy.index(write_command)
          assert legacy.index('loader.discover(folder, pattern=pattern, top_level_dir=folder)') < legacy.index(write_command)
          assert 'if not result.wasSuccessful():' in legacy and 'raise SystemExit(1)' in legacy
          assert 'path: |\n            out/daiso_daily_beauty_result.json\n            data/shopify_daily_registry.json' in legacy
          assert 'quarantine_blocked_public:' in legacy
          manifest = json.loads(Path('dist/deployment.json').read_text())
          assert len(manifest['files']) == 36
          assert manifest['site_hash'] == 'e1d4066609c67adccd89d738234436d6d99e131f0a5a71e7ca0c145e631c5046'
          assert set(p.relative_to('dist').as_posix() for p in Path('dist').rglob('*') if p.is_file()) == set(manifest['files']) | {'deployment.json'}
          assert not any(p.is_symlink() for p in Path('dist').rglob('*'))
          for name, expected in manifest['files'].items():
              assert hashlib.sha256((Path('dist') / name).read_bytes()).hexdigest() == expected
          review = json.loads(Path('dist/data/dashboard_runtime.json').read_text())['continuity_review']
          assert review['status'] == 'RESTRICTED_ANALYSIS_BLOCKED'
          assert review['production_recovered'] is False and review['operations_execution_verified'] is False
          PY
          tar --directory dist -cvf "$RUNNER_TEMP/artifact.tar" .
      - name: Upload only the verified public Pages archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
  deploy:
    needs: public-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the verified public archive
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
