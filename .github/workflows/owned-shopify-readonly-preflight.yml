name: Owned Shopify readonly connection preflight
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed main commit
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: owned-shopify-readonly-preflight
  cancel-in-progress: false
jobs:
  preflight:
    if: github.repository == 'coarfamily-cyber/jarvis-luna' && github.repository_id == '1431541717' && github.ref == 'refs/heads/main' && inputs.expected_sha == github.sha && github.run_attempt == 1
    environment: jarvis-shopify-writer
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Offline preflight regression tests
        run: python -B -m unittest discover -s scripts -p test_shopify_readonly_preflight.py -v
      - name: Read only shop, existing app identity and granted scope names
        env:
          SHOPIFY_STORE: rb3zh1-i1.myshopify.com
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: python -B scripts/shopify_readonly_preflight.py
