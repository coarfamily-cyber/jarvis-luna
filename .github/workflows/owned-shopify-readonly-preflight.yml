name: Owned Shopify connection and bounded canary
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed main commit
        required: true
        type: string
      mode:
        description: Connection, Organist read-only, reviewed VT canary, or source-only diagnostic
        required: true
        default: connection
        type: choice
        options: [connection, organist_dry_run, vt_usage_canary, source_diagnostic]
permissions:
  contents: read
concurrency:
  group: owned-shopify-readonly-preflight
  cancel-in-progress: false
jobs:
  preflight:
    if: github.repository == 'coarfamily-cyber/jarvis-luna' && github.repository_id == '1431541717' && github.ref == 'refs/heads/main' && inputs.expected_sha == github.sha && github.run_attempt == 1 && (inputs.mode == 'connection' || inputs.mode == 'organist_dry_run')
    environment: jarvis-shopify-writer
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Offline preflight regression tests
        env:
          PYTHONPATH: scripts
        run: python -B -m unittest test_shopify_readonly_preflight test_team_repair_readonly -v
      - name: Read only shop, existing app identity and granted scope names
        if: inputs.mode == 'connection'
        env:
          SHOPIFY_STORE: rb3zh1-i1.myshopify.com
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: python -B scripts/shopify_readonly_preflight.py
      - name: Read and recheck the one Organist team task without mutation
        if: inputs.mode == 'organist_dry_run'
        env:
          SHOPIFY_STORE: rb3zh1-i1.myshopify.com
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: python -B scripts/team_repair_readonly.py --root . --output "$RUNNER_TEMP/organist-readonly-attempt"
      - name: Preserve only redacted attempt and outcome metadata
        if: always() && inputs.mode == 'organist_dry_run'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: organist-readonly-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/organist-readonly-attempt/attempt.json
            ${{ runner.temp }}/organist-readonly-attempt/result.json
          if-no-files-found: error
          retention-days: 30
  vt_usage_canary:
    if: github.repository == 'coarfamily-cyber/jarvis-luna' && github.repository_id == '1431541717' && github.ref == 'refs/heads/main' && inputs.expected_sha == github.sha && github.run_attempt == 1 && github.run_number == 5 && inputs.mode == 'vt_usage_canary'
    environment: jarvis-shopify-writer
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Install existing hash-pinned offline verification dependencies
        run: python -m pip install --require-hashes -r requirements/requirements-verification.txt
      - name: Offline fixed-target regression checks before credentials
        env:
          PYTHONPATH: scripts
        run: python -B -m unittest test_vt_body_canary_policy test_vt_body_canary_runtime -v
      - name: Prepare original hash-only one-shot intent
        id: intent
        env:
          SHOPIFY_STORE: rb3zh1-i1.myshopify.com
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: python -B scripts/vt_body_canary_runtime.py prepare --root . --output "$RUNNER_TEMP/vt-usage-canary"
      - name: Preserve original hash-only intent before any product mutation
        id: checkpoint
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: vt-usage-intent-${{ steps.intent.outputs.operation_id }}-${{ github.run_id }}-1
          path: |
            ${{ runner.temp }}/vt-usage-canary/checkpoint/plan.json
            ${{ runner.temp }}/vt-usage-canary/checkpoint/journal.json
          if-no-files-found: error
          retention-days: 30
          overwrite: false
      - name: Verify original intent, freshly compare, apply once and read back
        env:
          SHOPIFY_STORE: rb3zh1-i1.myshopify.com
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          CHECKPOINT_ID: ${{ steps.checkpoint.outputs.artifact-id }}
          CHECKPOINT_DIGEST: ${{ steps.checkpoint.outputs.artifact-digest }}
        run: python -B scripts/vt_body_canary_runtime.py apply --root . --output "$RUNNER_TEMP/vt-usage-canary"
      - name: Preserve redacted outcome and consumed local intent
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: vt-usage-outcome-${{ github.run_id }}-1
          path: |
            ${{ runner.temp }}/vt-usage-canary/journal.json
            ${{ runner.temp }}/vt-usage-canary/result.json
          if-no-files-found: warn
          retention-days: 30
          overwrite: false
  source_diagnostic:
    if: github.repository == 'coarfamily-cyber/jarvis-luna' && github.repository_id == '1431541717' && github.ref == 'refs/heads/main' && inputs.expected_sha == github.sha && github.run_attempt == 1 && github.run_number == 7 && inputs.mode == 'source_diagnostic'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Install existing hash-pinned verification dependencies
        run: python -m pip install --require-hashes -r requirements/requirements-verification.txt
      - name: Offline source diagnostic regression checks
        env:
          PYTHONPATH: scripts
        run: python -B -m unittest test_vt_body_canary_policy test_vt_body_canary_runtime -v
      - name: One fixed supplier source diagnostic without Shopify credentials
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: python -B scripts/vt_body_canary_runtime.py source_diagnostic --root . --output "$RUNNER_TEMP/vt-source-diagnostic"
      - name: Preserve only safe source diagnostic receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: vt-source-diagnostic-${{ github.run_id }}-1
          path: ${{ runner.temp }}/vt-source-diagnostic/result.json
          if-no-files-found: warn
          retention-days: 30
          overwrite: false
