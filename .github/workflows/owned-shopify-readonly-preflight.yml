name: Owned Shopify readonly connection preflight
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed main commit
        required: true
        type: string
      mode:
        description: Connection metadata only, or one fixed Organist read-only team task
        required: true
        default: connection
        type: choice
        options: [connection, organist_dry_run]
permissions:
  contents: read
concurrency:
  group: owned-shopify-readonly-preflight
  cancel-in-progress: false
jobs:
  preflight:
    if: github.repository == 'coarfamily-cyber/jarvis-luna' && github.repository_id == '1431541717' && github.ref == 'refs/heads/main' && inputs.expected_sha == github.sha && github.run_attempt == 1 && (inputs.mode == 'connection' || inputs.mode == 'organist_dry_run')
    environment: jarvis-shopify-writer
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Offline preflight regression tests
        env:
          PYTHONPATH: scripts
        run: python -B -m unittest test_shopify_readonly_preflight test_team_repair_readonly -v
      - name: Read only shop, existing app identity and granted scope names
        if: inputs.mode == 'connection'
        env:
          SHOPIFY_STORE: rb3zh1-i1.myshopify.com
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: python -B scripts/shopify_readonly_preflight.py
      - name: Read and recheck the one Organist team task without mutation
        if: inputs.mode == 'organist_dry_run'
        env:
          SHOPIFY_STORE: rb3zh1-i1.myshopify.com
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: python -B scripts/team_repair_readonly.py --root . --output "$RUNNER_TEMP/organist-readonly-attempt"
      - name: Preserve only redacted attempt and outcome metadata
        if: always() && inputs.mode == 'organist_dry_run'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: organist-readonly-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/organist-readonly-attempt/attempt.json
            ${{ runner.temp }}/organist-readonly-attempt/result.json
          if-no-files-found: error
          retention-days: 30
