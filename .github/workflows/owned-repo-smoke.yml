name: Owned repository offline smoke
on:
  workflow_dispatch:
  schedule:
    - cron: '53 3 * * *'
permissions:
  contents: read
concurrency:
  group: owned-repository-offline-smoke
  cancel-in-progress: false
jobs:
  offline-smoke:
    if: github.repository == 'coarfamily-cyber/jarvis-luna' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Install hash-pinned offline test dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements/requirements-verification.txt
      - name: Verify owned workflow quarantine policy
        run: python -B scripts/check_owned_workflow_policy.py --root .
      - name: Run fixture-only tests with Python socket access blocked
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts/offline_test_policy:${{ github.workspace }}/scripts
          TYPESAFE_ENABLED: '0'
          GEMINI_ENABLED: '0'
          GEMINI_FALLBACK_ENABLED: '0'
        run: |
          python -B - <<'PY'
          import sys, socket, runpy, unittest
          def deny(*args, **kwargs):
              raise RuntimeError('Network prohibited during offline smoke tests')
          socket.create_connection = deny
          socket.socket.connect = deny
          socket.socket.connect_ex = deny
          sys.path.insert(0, 'scripts')
          for name in ('test_preflight_static', 'test_workflow_status', 'test_dependency_pins', 'test_owned_workflow_policy', 'test_owned_workflow_policy_independent', 'test_repository_provenance', 'test_repository_provenance_independent', 'test_repository_snapshot_reader', 'test_repository_snapshot_reader_independent'):
              module = __import__(name)
              result = unittest.TextTestRunner(verbosity=2).run(unittest.defaultTestLoader.loadTestsFromModule(module))
              if not result.wasSuccessful():
                  raise SystemExit(1)
          PY
